<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>For My Love 💙</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #000;
      overflow: hidden;
      font-family: Georgia, serif;
    }

    .page {
      position: fixed;
      inset: 0;
      display: none;
      justify-content: center;
      align-items: center;
      background: #000;
      opacity: 0;
      transform: scale(1.03);
      transition: opacity 0.7s ease, transform 0.7s ease;
    }

    .page.active {
      display: flex;
      opacity: 1;
      transform: scale(1);
    }

    .page img {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    .next {
      position: absolute;
      bottom: 28px;
      left: 50%;
      transform: translateX(-50%);
      padding: 13px 24px;
      border: none;
      border-radius: 30px;
      background: rgba(255,255,255,0.9);
      color: #222;
      font-size: 16px;
      font-family: Georgia, serif;
      box-shadow: 0 4px 15px rgba(0,0,0,0.3);
      cursor: pointer;
    }

    .next:active {
      transform: translateX(-50%) scale(0.95);
    }
  </style>
</head>

<body>

  <!-- We will add your Canva pages here next -->

  <div class="page active">
    <div style="color:white; text-align:center; padding:30px;">
      <h1>Happy Boyfriend's Day, my love. 💙</h1>
      <p>I made something for you.</p>
      <button class="next" onclick="nextPage()">Open your little surprise ♡</button>
    </div>
  </div>

  <script>
    let current = 0;
    const pages = document.querySelectorAll('.page');

    function nextPage() {
      if (current < pages.length - 1) {
        pages[current].classList.remove('active');
        current++;
        pages[current].classList.add('active');
      }
    }
  </script>

</body>
</html>
